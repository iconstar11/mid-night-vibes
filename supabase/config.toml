# Supabase project config for local development (`supabase start`).
# Create the hosted project in the dashboard, then: supabase link --project-ref <ref>
project_id = "midnight-vibes"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://midnightvibes.online"
additional_redirect_urls = ["https://midnightvibes.online/**", "https://www.midnightvibes.online/**", "http://localhost:8081/**", "midnightvibes://**"]
# Playing without an account uses anonymous sign-in
enable_anonymous_sign_ins = true

[realtime]
enabled = true

[functions.ideas]
# The function checks the user's JWT itself (anonymous users included)
verify_jwt = true

[functions.billing]
verify_jwt = true

[functions.paystack-webhook]
# Paystack can't send a Supabase JWT; the function verifies the Paystack-Signature header instead
verify_jwt = false

[functions.weekly-report]
# Called by pg_cron and the report page with REPORT_KEY, not a user JWT; the function checks the key itself
verify_jwt = false
