# Netlify: build the Expo web export and serve it at midnightvibes.online
[build]
  command = "npx expo export -p web"
  publish = "dist"

# Live room links like /r/K7QX9M2A are one client page
[[redirects]]
  from = "/r/*"
  to = "/r/[code].html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
