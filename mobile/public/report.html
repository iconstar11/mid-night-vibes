<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Weekly Report</title>
<!-- Private owner report. Open via the link in the Monday email: /report#key=…
     The key stays after the # (never sent to the web server) and goes only to the weekly-report function. -->
<style>
  :root { --bg:#F7E6E4; --surface:#FFF5F3; --ink:#3B0D1C; --muted:#8A5A66; --wine:#7A1F3D; --brass:#B8892B; --line:#E7C9C9; --up:#2E7D4F; --down:#B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1F0A14; --surface:#2E1220; --ink:#F7E1E4; --muted:#C29AA6; --wine:#E07A8C; --brass:#D9AE4B; --line:#4A2235; --up:#6FCF97; --down:#F28B82; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 400 34px/1.1 Georgia, serif; margin: 0; }
  h1 em { color: var(--wine); }
  h2 { font: 600 13px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 10px; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile.star { border-color: var(--brass); }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .num { font: 600 28px/1.2 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .d { font-size: 13px; font-weight: 600; }
  .d.up { color: var(--up); } .d.down { color: var(--down); } .d.flat { color: var(--muted); }
  .scroll { overflow-x: auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--muted); }
  .msg { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Midnight <em>Vibes</em> · your week</h1>
  <p class="sub" id="when">Loading…</p>
  <div id="out"></div>
</main>
<script>
(function () {
  var FN = "https://emijxiflxxgdvjumnbuy.supabase.co/functions/v1/weekly-report";
  var key = new URLSearchParams(location.hash.slice(1)).get("key");
  var out = document.getElementById("out"), when = document.getElementById("when");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pct(x) { return x == null ? "–" : Math.round(x * 100) + "%"; }
  function delta(a, b) {
    if (!b) return a ? '<span class="d up">new</span>' : '<span class="d flat">–</span>';
    var d = Math.round(((a - b) / b) * 100);
    return '<span class="d ' + (d > 0 ? "up" : d < 0 ? "down" : "flat") + '">' + (d > 0 ? "+" : "") + d + "% vs last week</span>";
  }
  function table(cols, rows) {
    if (!rows || !rows.length) return '<p class="muted">Not enough plays yet.</p>';
    return '<div class="scroll"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[2] || "") + '">' + c[1] + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.map(function (r) {
        return "<tr>" + cols.map(function (c) { var v = c[3] ? c[3](r[c[0]], r) : esc(r[c[0]]); return '<td class="' + (c[2] || "") + '">' + v + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }
  if (!key) { when.textContent = ""; out.innerHTML = '<div class="msg">Open this page from the link in your Monday email.</div>'; return; }
  history.replaceState(null, "", location.pathname); // take the key out of the address bar

  fetch(FN, { headers: { Authorization: "Bearer " + key } }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (res) {
    if (!res.ok) throw new Error(res.j && res.j.error || "Couldn't load the report.");
    var c = res.j.current, p = res.j.previous;
    when.textContent = "Last 7 days, to " + new Date(res.j.generated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    var tiles = [
      ["played_5_plus", "Played 5+ cards", true], ["visitors", "Visitors"], ["new_visitors", "New visitors"], ["returning", "Returning"],
      ["started_a_game", "Started a game"], ["cards_shown", "Cards shown"], ["guest_walls", "Hit the guest wall"], ["signups", "Sign-ups"],
      ["rooms_started", "Live rooms"], ["premium_views", "Saw Premium"], ["checkouts", "Started checkout"], ["premium_started", "New Premium"]
    ];
    var html = '<h2>This week</h2><div class="grid">' + tiles.map(function (t) {
      return '<div class="tile' + (t[2] ? " star" : "") + '"><div class="label">' + t[1] + (t[2] ? " ★ north star" : "") + '</div><div class="num">' + (c[t[0]] || 0) + "</div>" + delta(c[t[0]] || 0, p[t[0]] || 0) + "</div>";
    }).join("") + "</div>";
    var cardCols = [["text", "Card"], ["shown", "Shown", "n"], ["stars", "★", "n"], ["done", "Done", "n"], ["skip_rate", "Skipped", "n", pct], ["score", "Score", "n"]];
    html += "<h2>Best cards (5+ plays, smoothed star score)</h2>" + table(cardCols, c.top_cards);
    html += "<h2>Most skipped</h2>" + table(cardCols, c.most_skipped);
    html += "<h2>Where cards came from (tailored vs the rest)</h2>" + table([["source", "Source"], ["shown", "Shown", "n"], ["star_rate", "Star rate", "n", pct], ["done_rate", "Done rate", "n", pct], ["skip_rate", "Skip rate", "n", pct]], c.by_source);
    html += "<h2>Instagram and other links (?ref=)</h2>" + table([["ref", "ref"], ["visitors", "Visitors", "n"], ["signups", "Sign-ups", "n"]], c.by_ref);
    out.innerHTML = html;
  }).catch(function (e) { when.textContent = ""; out.innerHTML = '<div class="msg">' + esc(e.message) + "</div>"; });
})();
</script>
</body>
</html>
